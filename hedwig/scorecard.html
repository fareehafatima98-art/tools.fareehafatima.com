<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Outbound Readiness Score — HEDWIG</title>
<link rel="stylesheet" href="styles.css">
<style>
.sc-head{display:grid;grid-template-columns:72px 1fr auto;gap:20px;align-items:center;padding:48px 0 28px}
.sc-head .logo{width:72px;height:72px;border-radius:14px;border:1px solid var(--line);background:#fff;object-fit:contain;padding:8px}
.sc-head .mono{width:72px;height:72px;border-radius:14px;background:var(--acc2);color:#fff;font:700 26px Georgia,serif;display:flex;align-items:center;justify-content:center}
.sc-head h1{font-size:36px;line-height:1.1}
.sc-head .for{color:var(--muted);font-size:15px;margin-top:4px}
.total{text-align:right}
.total b{display:block;font:700 56px/1 Georgia,serif}
.total span{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.band{display:inline-block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:5px 10px;border-radius:999px;margin-top:8px}
.band.early{background:#fbe6e1;color:var(--acc)}.band.close{background:#fdf1d6;color:#8a5a00}.band.ready{background:#e2efe4;color:#1e6b3a}
.verdict{font-family:Georgia,serif;font-size:26px;line-height:1.3;margin:10px 0 14px;max-width:30ch}
.summary{font-size:18px;color:var(--ink);max-width:62ch}
.video{margin:30px 0 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9}
.video video,.video iframe{width:100%;height:100%;display:block;border:0}
.caption{color:var(--muted);font-size:14px;margin-top:8px}
table.scores{width:100%;border-collapse:collapse;margin:14px 0 6px;font-size:15.5px}
table.scores td{padding:12px 8px;border-top:1px solid var(--line);vertical-align:top}
table.scores td.c{width:42%;font-weight:600}
table.scores td.s{width:110px;white-space:nowrap}
.pips{display:inline-flex;gap:4px;vertical-align:middle;margin-right:8px}
.pips i{width:12px;height:12px;border-radius:3px;background:var(--line);display:inline-block}
.pips i.on{background:var(--acc2)}
.pips.low i.on{background:var(--acc)}
table.scores td.note{color:var(--muted);font-size:14.5px}
.fix{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;margin:16px 0}
.fix h3{margin:0 0 8px;font-size:21px}
.fix p{margin:0;color:var(--ink)}
.fine{color:var(--muted);font-size:13.5px}
.err{padding:80px 0;text-align:center;color:var(--muted)}
@media (max-width:720px){.sc-head{grid-template-columns:56px 1fr;}.total{grid-column:1/-1;text-align:left}.sc-head h1{font-size:28px}.verdict{font-size:22px}table.scores td.c{width:50%}table.scores td.note{display:block;padding-top:0;border:0}table.scores tr{display:block;border-top:1px solid var(--line)}table.scores td{border:0}}
</style>
</head>
<body>
<nav>
  <a class="brand" href="index.html">HEDWIG</a>
  <div class="links"><a href="case-study.html">Case study</a><a href="pricing.html">Pricing</a><a href="about.html">About</a><a class="btn" href="#book">Talk to Fareeha</a></div>
</nav>

<div class="wrap" id="app">
  <div class="err">Loading your score…</div>
</div>

<footer>
  <span>HEDWIG · a Fatima &amp; Co company</span>
  <span><a href="mailto:hello@hedwigandco.com">hello@hedwigandco.com</a></span>
</footer>

<script>
const BLOB = "https://gzbaq0nk2iyh6nku.public.blob.vercel-storage.com/scorecards/";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = (new URLSearchParams(location.search).get("c") || "").replace(/[^a-z0-9-]/g, "");
const app = document.getElementById("app");

function pips(n){ n = Math.max(0, Math.min(5, parseInt(n) || 0));
  return `<span class="pips ${n <= 1 ? "low" : ""}">${[0,1,2,3,4].map(i => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span>${n}/5`; }

function render(d){
  const crit = d.criteria || [];
  const scores = d._scores || {}, notes = d._notes || {};
  const first = d.first_name ? ` for ${esc(d.first_name)}` : "";
  const total = d.total ?? Object.values(scores).reduce((a,b) => a + (parseInt(b) || 0), 0);
  const band = d.band || (total >= 35 ? "ready" : total >= 20 ? "close" : "early");
  const bandLabel = {early: "Early", close: "Close", ready: "Ready"}[band];
  document.title = `${d.company} — Outbound Readiness Score — HEDWIG`;
  const logo = d.logo_url
    ? `<img class="logo" src="${esc(d.logo_url)}" alt="" onerror="this.outerHTML='<div class=mono>${esc(d.monogram)}</div>'">`
    : `<div class="mono">${esc(d.monogram)}</div>`;
  const video = d.video_url
    ? `<div class="video">${/youtube|youtu\.be|loom|vimeo/.test(d.video_url)
        ? `<iframe src="${esc(d.video_url)}" allow="autoplay; fullscreen" allowfullscreen></iframe>`
        : `<video src="${esc(d.video_url)}" controls playsinline></video>`}</div>
       <div class="caption">${esc(d.caption || "")}${d.video_length ? " · " + esc(d.video_length) : ""}</div>`
    : "";
  app.innerHTML = `
  <div class="sc-head">
    ${logo}
    <div>
      <div class="kicker">Outbound Readiness Score${first}</div>
      <h1>${esc(d.company)}</h1>
      <div class="for">Scored from ${esc((d.sources || [])[0] || "")} on ${esc(d.generated || "")}. Nothing here is invented: if the site does not say it, it counts as absent.</div>
    </div>
    <div class="total"><b>${total}<span style="font-size:22px;color:var(--muted)">/50</span></b><span>out of 50</span><br><span class="band ${band}">${bandLabel}</span></div>
  </div>

  <section style="padding-top:0">
    ${d.verdict ? `<div class="verdict">${esc(d.verdict)}</div>` : ""}
    ${d.summary ? `<p class="summary">${esc(d.summary)}</p>` : ""}
    ${video}
  </section>

  <section>
    <h2>The ten metrics</h2>
    <p class="fine">Each one is a question a cold email has to answer before a stranger replies. Scored 0 to 5 from your public site only.</p>
    <table class="scores">
      ${crit.map((c, i) => `<tr><td class="c">${i + 1}. ${esc(c)}</td><td class="s">${pips(scores[String(i + 1)])}</td><td class="note">${esc(notes[String(i + 1)] || "")}</td></tr>`).join("")}
    </table>
  </section>

  <section>
    <h2>${esc(d.heading || "Two things that would lift your reply rate first")}</h2>
    ${(d.suggestions || []).map(s => `<div class="fix"><h3>${esc(s.title)}</h3><p>${esc(s.body)}</p></div>`).join("")}
    <p class="fine">Both are cheap to test. Neither needs a product change.</p>
  </section>

  <section class="book" id="book" style="border:0">
    <h2>Want the two changes run for you?</h2>
    <div class="lines">
      <p>HEDWIG builds and runs outbound for healthcare companies. You get qualified conversations in under 45 days. Your team closes them.</p>
      <p>Pick a time with Fareeha, physician and founder. Bring this page.</p>
    </div>
    <div class="cal">
      <div class="calendly-inline-widget" data-url="${esc(d.calendly || "https://calendly.com/hifareeha/discovery-meeting-with-fareeha")}?hide_gdpr_banner=1" style="min-width:320px;height:660px;"></div>
    </div>
    <p class="fine" style="margin-top:14px">Prefer email? <a href="mailto:hello@hedwigandco.com">hello@hedwigandco.com</a></p>
  </section>`;
  const s = document.createElement("script"); s.src = "https://assets.calendly.com/assets/external/widget.js"; s.async = true; document.body.appendChild(s);
}

(async () => {
  if (!slug) { app.innerHTML = `<div class="err">No score requested. <a href="index.html">Back to HEDWIG</a></div>`; return; }
  try {
    const r = await fetch(BLOB + slug + ".json", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    app.innerHTML = `<div class="err">We couldn't find that score. <a href="index.html">Back to HEDWIG</a></div>`;
  }
})();
</script>
</body>
</html>
